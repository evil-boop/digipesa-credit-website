[14:08, 8/17/2026] Peters: github.com/evil-boop/digipesa-credit-website
[14:11, 8/17/2026] Peters: # Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: evil-boop/digipesa-credit-website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/47d061d5-cf46-4946-aef6-64d5d11b3702/pkce
  auth_token_endpoint: /sites/47d061d5-cf46-4946-aef6-64d5d11b3702/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://digipesa-credit-ltd.netlify.app

media_folder: "images"
public_folder: "/images"

collections:
  - name: "site"
    label: "Maudhui ya Tovuti"
    files:
      - file: "data/content.json"
        label: "Ukurasa wa Nyumbani"
        name: "content"
        fields:
          - label: "Sehemu ya Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Maandishi madogo (juu ya kichwa)", name: "eyebrow", widget: "string" }
              - { label: "Kichwa cha Habari — Mstari 1", name: "headline_line1", widget: "string" }
              - { label: "Kichwa cha Habari — Neno la Rangi ya Dhahabu", name: "headline_emphasis", widget: "string" }
              - { label: "Kichwa cha Habari — Mstari 2", name: "headline_line2", widget: "string" }
              - { label: "Maelezo Mafupi (Lead)", name: "lead", widget: "text" }
              - { label: "Mwaka wa Kuanzishwa", name: "founded_year", widget: "string" }

          - label: "Bidhaa — NISOGEZE"
            name: "products"
            widget: "object"
            fields:
              - label: "NISOGEZE"
                name: "nisogeze"
                widget: "object"
                fields:
                  - { label: "Kiasi cha Mkopo", name: "amount", widget: "string" }
                  - { label: "Muda wa Malipo", name: "term", widget: "string" }
                  - { label: "Riba", name: "rate", widget: "string" }
                  - { label: "Muda wa Maamuzi", name: "decision_time", widget: "string" }
                  - { label: "Vitakiwavyo", name: "requirements", widget: "string" }
              - label: "Mkopo wa Biashara (SME)"
                name: "sme"
                widget: "object"
                fields:
                  - { label: "Kiasi cha Mkopo", name: "amount", widget: "string" }
                  - { label: "Muda wa Malipo", name: "term", widget: "string" }
                  - { label: "Riba", name: "rate", widget: "string" }
                  - { label: "Vitakiwavyo", name: "requirements", widget: "string" }

          - label: "Mawasiliano"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Namba ya Simu (inayoonekana)", name: "phone_display", widget: "string" }
              - { label: "Namba ya Simu (kwa link — mfano +255700000000)", name: "phone_href", widget: "string" }
              - { label: "Barua Pepe", name: "email", widget: "string" }
              - { label: "Anwani ya Ofisi", name: "address", widget: "string" }
              - { label: "Muda wa Kazi", name: "hours", widget: "string" }

          - label: "Maswali (FAQ)"
            name: "faq"
            widget: "list"
            label_singular: "Swali"
            fields:
              - { label: "Swali", name: "question", widget: "string" }
              - { label: "Jibu", name: "answer", widget: "text" 
